# Render.com Blueprint — 대시보드에서 "New + → Blueprint"로 이 레포 연결 시 자동 사용
services:
  - type: web
    name: lighthouse-server
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free               # 무료. 메모리 부족(OOM)으로 분석이 죽으면 starter/standard로 상향
    region: singapore        # 한국에서 가까운 무료 리전
    healthCheckPath: /health
    envVars:
      - key: CRUX_API_KEY    # 선택: CrUX 실제 사용자 데이터
        sync: false
